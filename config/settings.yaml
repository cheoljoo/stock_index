site_url: "http://localhost:8501"
storage:
  db_path: "data/meta.db"
  parquet_dir: "data/series"
smtp:
  host: "smtp.gmail.com"
  port: 587
  user: "cheoljoo@gmail.com"
  password_env: "SMTP_PASSWORD"
  from: "cheoljoo@gmail.com"
schedule:
  run_time: "18:00"
  tz: "Asia/Seoul"
collect:
  lookback_days: 365      # 최초 수집 시 과거 데이터 기간
  retry_max: 3
  retry_wait_seconds: 5
alert:
  suppress_duplicate_days: 1   # 동일 임계치 재발송 억제 일수
screener:
  min_days: 3           # DB에 남길 최소 연속 동반매수/매도 일수
  notify_min_days: 5    # 이 이상이면 일일 다이제스트 메일 발송
  notify: default
  foreign_start_days: 3 # 외국인이 N거래일 연속 순매수/순매도하면 "시작"으로 본다
  # 외국인 지분율 스크리너 (연속매수 횟수가 아니라 실제 보유 비중 변화를 봄)
  ownership_lookback_days: 30
  ownership_steady_min_change_pct: 0.5      # 30일간 지분율 +0.5%p 이상 & 상승일 비율 충족 시 "지속 증가"
  ownership_steady_min_up_ratio: 0.6
  ownership_spike_min_daily_change_pct: 0.3 # 하루 지분율 +0.3%p 이상이면 "일시 급증"
# 매일 run_daily 실행 결과를 HTML 메일(전체 로그 첨부)로 보낸다
report:
  enabled: true
  to: ["cheoljoo@gmail.com"]
